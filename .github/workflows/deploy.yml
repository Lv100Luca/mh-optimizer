name: Build and deploy

# Tests, publishes and smoke-tests (tools/smoke) the browser app on every PR and push; a push to main (or the Run workflow
# button on main) also copies the site to the VPS, where Caddy serves it from disk, and smoke-tests the live site. The site
# is static, so a deploy restarts nothing.
# See DEPLOY.md for the one-time VPS setup and the repo variables and secret this needs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a newer PR push makes the running check moot; deploys queue instead of cancelling halfway
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # node bundles or-tools-wasm into wwwroot/solver on publish
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MHWildsOptimizer.Browser/solver/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      # relinks the .NET runtime on publish (smaller download), as on the dev machine
      - run: dotnet workload install wasm-tools

      # the tests need neither the solver bundle nor the server's React client
      - run: dotnet test MHWildsOptimizer.slnx -c Release -p:BuildSolver=false -p:BuildClient=false

      - run: dotnet publish src/MHWildsOptimizer.Browser -c Release -o publish/browser

      # the publish output in headless Chrome before it goes anywhere: boots cross-origin isolated, wiki pages render,
      # the example weapon runs to results (tools/smoke/smoke.mjs)
      - name: Browser smoke test
        run: |
          python3 spikes/WasmSpeedTest/serve.py 5251 publish/browser/wwwroot > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:5251/ && break; sleep 1; done
          node tools/smoke/smoke.mjs http://127.0.0.1:5251

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: publish/browser/wwwroot
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      SITE_URL: https://wildsbuilds.com
    steps:
      # only for the smoke test after the copy; first, because checkout empties the workspace
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tools/smoke
            inputs

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # a secret set from a Windows file can carry CRLF line endings, which OpenSSH rejects ("error in libcrypto")
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # derive the public key: fails clearly on a mangled secret, and the fingerprint can be compared with the VPS's
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub \
            || { echo "::error::VPS_SSH_KEY is not a readable private key (set it from the key file, see DEPLOY.md)"; exit 1; }
          ssh-keygen -l -f ~/.ssh/id_deploy.pub
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # The key is locked to rrsync on /opt/mh-optimizer/site (DEPLOY.md), so the target path is relative to that.
      # --delay-updates swaps the new files in at the end, so a visitor mid-deploy never gets half a site.
      - name: Copy the site to the VPS
        run: |
          rsync -rz --delete --delay-updates --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_deploy -p $VPS_PORT" \
            site/ "$VPS_USER@$VPS_HOST:"

      # WebAssembly threads only work when the page is cross-origin isolated, so check the headers, not just the 200
      - name: Smoke test
        run: |
          headers=$(curl -sSI --fail "$SITE_URL/")
          echo "$headers"
          echo "$headers" | grep -qi '^cross-origin-opener-policy: same-origin' || { echo "::error::COOP header missing"; exit 1; }
          echo "$headers" | grep -qi '^cross-origin-embedder-policy: require-corp' || { echo "::error::COEP header missing"; exit 1; }
          curl -sSI --fail "$SITE_URL/solver/bridge.js" > /dev/null
          # the static wiki pages (MHWildsOptimizer.StaticSite) and the sitemap that lists them
          curl -sSI --fail "$SITE_URL/wiki/skills/agitator/" > /dev/null
          curl -sSI --fail "$SITE_URL/sitemap.xml" > /dev/null
          # an unknown wiki page is a real 404 (deploy/Caddyfile), not the app answering 200; only a warning, because the
          # Caddyfile is installed on the VPS by hand and a deploy cannot fix it
          status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/wiki/skills/no-such-skill/")
          [ "$status" = 404 ] || echo "::warning::an unknown wiki page answered $status, not 404: install deploy/Caddyfile on the VPS (DEPLOY.md step 4)"
          # www and the old subdomain move to the one address with the path kept (deploy/Caddyfile); a warning for the same reason
          for host in www.wildsbuilds.com mh-optimizer.luca-diegel.de; do
            got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://$host/skills" || true)
            [ "$got" = "301 $SITE_URL/skills" ] || echo "::warning::https://$host/skills answered '$got', not a 301 to $SITE_URL/skills: install deploy/Caddyfile on the VPS (DEPLOY.md step 4)"
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # the same browser test as before the copy, now through Caddy (headers, caching, the live files)
      - name: Browser smoke test (live site)
        run: node tools/smoke/smoke.mjs "$SITE_URL"
